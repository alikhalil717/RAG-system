<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG Code Assistant</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f5f5;
    --sidebar-bg: #1e1e2e;
    --sidebar-text: #cdd6f4;
    --sidebar-hover: #313244;
    --sidebar-active: #45475a;
    --panel-bg: #ffffff;
    --border: #e0e0e0;
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --user-msg: #eef2ff;
    --assistant-msg: #fafafa;
    --text: #1e1e2e;
    --text-muted: #6c6c80;
    --code-bg: #f4f4f5;
    --font: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --radius: 8px;
  }
  html, body { height: 100%; font-family: var(--font); background: var(--bg); color: var(--text); }
  body { display: flex; }

  /* ─── Sidebar ─── */
  .sidebar {
    width: 260px; min-width: 260px;
    background: var(--sidebar-bg); color: var(--sidebar-text);
    display: flex; flex-direction: column;
    border-right: 1px solid rgba(255,255,255,0.05);
  }
  .sidebar-header {
    padding: 20px 16px 12px;
    font-size: 15px; font-weight: 600;
    letter-spacing: 0.3px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .sidebar-header span { color: #a6adc8; font-weight: 400; font-size: 13px; }
  .session-list {
    flex: 1; overflow-y: auto;
    padding: 8px 8px;
  }
  .session-btn {
    display: flex; align-items: center; gap: 8px;
    width: 100%; padding: 10px 12px;
    background: transparent; border: none; border-radius: var(--radius);
    color: var(--sidebar-text); cursor: pointer;
    font-size: 13px; text-align: left;
    transition: background 0.15s;
  }
  .session-btn:hover { background: var(--sidebar-hover); }
  .session-btn.active { background: var(--sidebar-active); font-weight: 500; color: #fff; }
  .session-btn .del {
    margin-left: auto; opacity: 0; transition: opacity 0.15s;
    background: none; border: none; color: #f38ba8; cursor: pointer;
    font-size: 16px; line-height: 1; padding: 0 2px;
  }
  .session-btn:hover .del { opacity: 0.7; }
  .session-btn .del:hover { opacity: 1 !important; }
  .sidebar-footer { padding: 12px 8px; border-top: 1px solid rgba(255,255,255,0.06); }
  .new-session-btn {
    width: 100%; padding: 10px;
    background: var(--primary); color: #fff; border: none; border-radius: var(--radius);
    cursor: pointer; font-size: 13px; font-weight: 500;
    transition: background 0.15s;
  }
  .new-session-btn:hover { background: var(--primary-hover); }

  .main {
    flex: 1; display: flex; flex-direction: column;
    min-width: 0;
  }
  .panel-header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-bg);
    font-size: 14px; color: var(--text-muted);
  }
  .conversation {
    flex: 1; overflow-y: auto;
    padding: 24px;
    display: flex; flex-direction: column;
    gap: 20px;
  }
  .conversation:empty::after {
    content: 'Ask a question to get started.';
    display: block; text-align: center;
    color: var(--text-muted); margin-top: 60px;
    font-size: 14px;
  }

  .msg-card {
    max-width: 820px; width: 100%;
    margin: 0 auto;
    display: flex; flex-direction: column;
    gap: 6px;
  }
  .msg-card.user { align-items: flex-end; }
  .msg-card.assistant { align-items: flex-start; }

  .msg-bubble {
    padding: 12px 18px;
    border-radius: 18px;
    line-height: 1.6;
    font-size: 14px;
    word-wrap: break-word;
    white-space: pre-wrap;
    max-width: 100%;
  }
  .msg-card.user .msg-bubble {
    background: var(--primary);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg-card.assistant .msg-bubble {
    background: var(--assistant-msg);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg-card.assistant .msg-bubble code {
    background: var(--code-bg);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
  }
  .msg-card.assistant .msg-bubble pre {
    background: var(--code-bg);
    padding: 12px 16px;
    border-radius: var(--radius);
    overflow-x: auto;
    font-size: 13px;
    margin: 8px 0;
  }
  .msg-card.assistant .msg-bubble pre code {
    background: none; padding: 0;
  }

  .msg-label {
    font-size: 11px; color: var(--text-muted);
    padding: 0 6px;
  }

  .sources-toggle {
    margin-top: 4px;
    background: none; border: none;
    color: var(--primary);
    cursor: pointer;
    font-size: 12px;
    padding: 4px 6px;
    border-radius: 4px;
  }
  .sources-toggle:hover { background: var(--user-msg); }
  .sources-content {
    display: none;
    margin-top: 6px;
    max-width: 100%;
  }
  .sources-content.open { display: block; }
  .source-chunk {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
    margin-bottom: 6px;
    font-size: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
    max-height: 200px;
    overflow-y: auto;
  }
  .source-chunk .meta {
    color: var(--text-muted);
    margin-bottom: 4px;
    font-size: 11px;
  }

  .input-area {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    background: var(--panel-bg);
  }
  .input-row {
    max-width: 820px; margin: 0 auto;
    display: flex; gap: 10px;
  }
  .input-row input {
    flex: 1;
    padding: 12px 18px;
    border: 1px solid var(--border);
    border-radius: 24px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  .input-row input:focus { border-color: var(--primary); }
  .input-row button {
    padding: 12px 24px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .input-row button:hover { background: var(--primary-hover); }
  .input-row button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .loading { display: flex; align-items: center; gap: 8px; }
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 768px) {
    .sidebar { width: 200px; min-width: 200px; }
    .conversation { padding: 16px; }
    .input-area { padding: 12px 16px; }
  }
</style>
</head>
<body>

<!-- ─── Sidebar ─── -->
<aside class="sidebar">
  <div class="sidebar-header">
    RAG Assistant
    <span>sessions</span>
  </div>
  <div class="session-list" id="sessionList"></div>
  <div class="sidebar-footer">
    <button class="new-session-btn" onclick="newSession()">+ New Session</button>
  </div>
</aside>

<main class="main">
  <div class="panel-header" id="panelHeader">Session: <strong id="currentSessionLabel">default</strong></div>
  <div class="conversation" id="conversation"></div>
  <div class="input-area">
    <div class="input-row">
      <input type="text" id="queryInput" placeholder="Ask a question about your PDFs..."
             onkeydown="if(event.key==='Enter') sendQuery()">
      <button id="sendBtn" onclick="sendQuery()">Send</button>
    </div>
  </div>
</main>

<script>
let currentSession = 'default';
let sessions = [];

async function init() {
  await refreshSessions();
  // Ensure default session exists
  if (!sessions.includes('default')) {
    await fetch('/api/sessions', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({session_id: 'default'})
    });
    await refreshSessions();
  }
  selectSession('default');
}
init();

async function refreshSessions() {
  const res = await fetch('/api/sessions');
  const data = await res.json();
  sessions = data.sessions || [];
  renderSessions();
}

function renderSessions() {
  const el = document.getElementById('sessionList');
  el.innerHTML = sessions.map(s => `
    <button class="session-btn${s === currentSession ? ' active' : ''}"
            onclick="selectSession('${s}')">
      <span>💬</span>
      <span class="name">${escHtml(s)}</span>
      <button class="del" onclick="event.stopPropagation(); deleteSession('${s}')" title="Delete session">✕</button>
    </button>
  `).join('');
}

async function selectSession(id) {
  currentSession = id;
  document.getElementById('currentSessionLabel').textContent = id;
  renderSessions();
  await loadConversation();
}

async function newSession() {
  const res = await fetch('/api/sessions', {method: 'POST'});
  const data = await res.json();
  await refreshSessions();
  selectSession(data.session_id);
}

async function deleteSession(id) {
  if (sessions.length <= 1) {
    alert('Cannot delete the last session.');
    return;
  }
  await fetch(`/api/sessions/${encodeURIComponent(id)}`, {method: 'DELETE'});
  await refreshSessions();
  if (currentSession === id) {
    const remaining = document.querySelectorAll('.session-btn');
    if (remaining.length > 0) remaining[0].click();
    else selectSession('default');
  }
}
function loadConversation() {

  const convo = document.getElementById('conversation');
  convo.innerHTML = '';

}

function addMessage(role, text, chunks) {
  const convo = document.getElementById('conversation');
  const card = document.createElement('div');
  card.className = `msg-card ${role}`;

  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = role === 'user' ? 'You' : 'Assistant';

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';

  if (role === 'assistant') {
    bubble.innerHTML = renderMsg(text);
  } else {
    bubble.textContent = text;
  }

  card.appendChild(label);
  card.appendChild(bubble);

  if (role === 'assistant' && chunks && chunks.length > 0) {
    const toggle = document.createElement('button');
    toggle.className = 'sources-toggle';
    toggle.textContent = `📄 View Sources (${chunks.length})`;
    toggle.onclick = () => {
      const srcDiv = card.querySelector('.sources-content');
      srcDiv.classList.toggle('open');
      toggle.textContent = srcDiv.classList.contains('open')
        ? `📄 Hide Sources (${chunks.length})`
        : `📄 View Sources (${chunks.length})`;
    };
    card.appendChild(toggle);

    const srcDiv = document.createElement('div');
    srcDiv.className = 'sources-content';
    chunks.forEach(c => {
      const chunkEl = document.createElement('div');
      chunkEl.className = 'source-chunk';
      const meta = [];
      if (c.book) meta.push(`📖 ${c.book}`);
      if (c.chapter) meta.push(`📑 ${c.chapter}`);
      if (c.page != null) meta.push(`📄 p.${c.page}`);
      if (c.code_language) meta.push(`💻 ${c.code_language}`);
      chunkEl.innerHTML = `<div class="meta">${meta.join(' &middot; ')}</div>${escHtml(c.chunk || c.text || '')}`;
      srcDiv.appendChild(chunkEl);
    });
    card.appendChild(srcDiv);
  }

  convo.appendChild(card);
  convo.scrollTop = convo.scrollHeight;
}

// ─── Query ───
async function sendQuery() {
  const input = document.getElementById('queryInput');
  const btn = document.getElementById('sendBtn');
  const query = input.value.trim();
  if (!query) return;

  input.value = '';
  input.disabled = true;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Thinking...';

  addMessage('user', query, null);

  const convo = document.getElementById('conversation');
  const loadingCard = document.createElement('div');
  loadingCard.className = 'msg-card assistant';
  loadingCard.id = 'loadingCard';
  loadingCard.innerHTML = `
    <div class="msg-label">Assistant</div>
    <div class="msg-bubble loading"><span class="spinner"></span> Thinking...</div>
  `;
  convo.appendChild(loadingCard);
  convo.scrollTop = convo.scrollHeight;

  try {
    const res = await fetch('/api/query', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({query, session_id: currentSession, top_k: 5})
    });
    const data = await res.json();

    loadingCard.remove();

    if (data.error) {
      addMessage('assistant', `Error: ${data.error}`, null);
    } else {
      addMessage('assistant', data.answer, data.chunks || []);
    }
  } catch (err) {
    loadingCard.remove();
    addMessage('assistant', `Network error: ${err.message}`, null);
  }

  input.disabled = false;
  btn.disabled = false;
  btn.textContent = 'Send';
  input.focus();
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function renderMsg(text) {
  let html = '';
  const parts = text.split(/(```[\s\S]*?```)/g);
  for (const part of parts) {
    if (part.startsWith('```')) {
      const inner = part.replace(/^```\w*\n?/, '').replace(/\n?```$/, '');
      html += `<pre><code>${escHtml(inner)}</code></pre>`;
    } else {
      // Inline code
      let lines = part.split('\n');
      html += lines.map(line => {
        if (line.trim() === '') return '<br>';
        const withCode = line.replace(/`([^`]+)`/g, '<code>$1</code>');
        return withCode;
      }).join('\n');
    }
  }
  return html;
}
</script>
</body>
</html>
